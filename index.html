<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LingoWay | Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,700;1,700&family=Prata&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="logo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
    <path d="M22 10v6"/>
    <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
  </svg>
  <span>LingoWay</span>
</div>
      <h1>Create Your Account</h1>
      <p class="subtitle">Start your learning journey with us.</p>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Your full name">
          <p class="error" id="fullNameError"></p>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com">
          <p class="error" id="emailError"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-box">
            <input type="password" id="password" placeholder="Create a password">
            <button type="button" class="show-btn" id="togglePassword">Show</button>
          </div>
          <p class="hint">At least 8 characters, with a capital letter and a special character like @ or $.</p>
          <p class="error" id="passwordError"></p>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-box">
            <input type="password" id="confirmPassword" placeholder="Repeat your password">
            <button type="button" class="show-btn" id="toggleConfirm">Show</button>
          </div>
          <p class="error" id="confirmError"></p>
        </div>

        <div class="field">
          <label class="checkbox">
            <input type="checkbox" id="terms">
            <span>I agree to the Terms and Conditions</span>
          </label>
          <p class="error" id="termsError"></p>
        </div>

        <button type="submit" class="btn">Create Account</button>
      </form>

      <p class="bottom-text">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
